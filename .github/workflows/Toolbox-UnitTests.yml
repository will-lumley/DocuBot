name: Toolbox Unit Tests

on:
 push:
   branches: [ "main" ]
 pull_request:
   branches: [ "main" ]

jobs:
  build-and-test:

    runs-on: macos-15

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
          submodules: 'recursive'

    - name: Get swift version
      run: swift --version

    - name: Run Tests
      run: |
        cd DocuBotToolbox/Sources/DocuBotToolbox
        swift test